<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ระบบจัดการผู้ใช้งาน</title>
    <!-- ใช้ Tailwind CSS เพื่อความสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">จัดการผู้ใช้งาน (Admin)</h1>
                <p class="text-slate-500 text-sm">ตรวจสอบและอนุมัติสมาชิกรายใหม่</p>
            </div>
            <button onclick="loadUsers()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg transition-all shadow-md active:scale-95">
                🔄 รีเฟรชข้อมูล
            </button>
        </header>

        <!-- Table Container -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-100 border-b border-slate-200">
                        <tr>
                            <th class="p-4 font-semibold text-slate-700">ชื่อ-นามสกุล</th>
                            <th class="p-4 font-semibold text-slate-700">เบอร์โทรศัพท์</th>
                            <th class="p-4 font-semibold text-slate-700 text-center">สถานะ</th>
                            <th class="p-4 font-semibold text-slate-700 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    
                    <!-- *** จุดสำคัญที่ทำให้เกิด Error ก่อนหน้านี้ คือต้องมี id="tableBody" *** -->
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="4" class="p-10 text-center text-slate-400">กำลังเตรียมการ...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ใช้ URL เดิมของคุณ
        const GasUrl = "https://script.google.com/macros/s/AKfycbwuQGtRMZG1LhpuM4jBKHdjDwzlENSKmqrAyWAtGKPOBrPfXeKX_AS5KIGBXgg_m3xunw/exec";

        // เมื่อโหลดหน้าเว็บเสร็จให้ดึงข้อมูลทันที
        window.onload = loadUsers;

        async function loadUsers() {
            const tbody = document.getElementById('tableBody');
            if (!tbody) return; // ป้องกัน Error หากหา Element ไม่เจอ

            tbody.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-slate-400"><div class="flex justify-center items-center gap-2"><span>กำลังโหลดข้อมูล...</span></div></td></tr>';

            try {
                const response = await fetch(GasUrl, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getAllUsers' })
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    renderTable(result.data);
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                console.error("Error:", err);
                tbody.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-red-500">โหลดข้อมูลไม่สำเร็จ: ${err.message}</td></tr>`;
            }
        }

        function renderTable(users) {
            const tbody = document.getElementById('tableBody');
            if (!users || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-slate-400">ไม่พบข้อมูลรายชื่อในระบบ</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(user => {
                // เช็คสถานะเพื่อเปลี่ยนสี Badge
                const statusColor = user[3] === 'Approved' ? 'bg-green-100 text-green-700' : 
                                  user[3] === 'Rejected' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700';
                
                return `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-4">
                        <div class="font-semibold text-slate-800">${user[1]}</div>
                        <div class="text-xs text-slate-400 font-mono">${user[0]}</div>
                    </td>
                    <td class="p-4 text-slate-600">${user[2]}</td>
                    <td class="p-4 text-center">
                        <span class="px-3 py-1 rounded-full text-xs font-medium ${statusColor}">
                            ${user[3] || 'Pending'}
                        </span>
                    </td>
                    <td class="p-4 flex justify-center gap-2">
                        <button onclick="updateStatus('${user[0]}', 'Approved')" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded-lg text-sm shadow-sm transition active:scale-90">อนุมัติ</button>
                        <button onclick="updateStatus('${user[0]}', 'Rejected')" class="bg-red-400 hover:bg-red-500 text-white px-3 py-1 rounded-lg text-sm shadow-sm transition active:scale-90">ปฏิเสธ</button>
                    </td>
                </tr>
                `;
            }).join('');
        }

        async function updateStatus(uid, status) {
            if (!confirm(`คุณต้องการเปลี่ยนสถานะผู้ใช้เป็น [${status}] ใช่หรือไม่?`)) return;

            try {
                // แสดงสถานะ Loading ระหว่างอัปเดต
                const response = await fetch(GasUrl, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'updateStatus', 
                        userId: uid, 
                        status: status 
                    })
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    alert("บันทึกข้อมูลสำเร็จ: " + result.message);
                    loadUsers(); // รีโหลดตารางใหม่เพื่อแสดงสถานะล่าสุด
                } else {
                    alert("บันทึกไม่สำเร็จ: " + result.message);
                }
            } catch (err) {
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์");
            }
        }
    </script>
</body>
</html>
