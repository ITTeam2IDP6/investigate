<script>
    const GasUrl = "https://script.google.com/macros/s/AKfycbwuQGtRMZG1LhpuM4jBKHdjDwzlENSKmqrAyWAtGKPOBrPfXeKX_AS5KIGBXgg_m3xunw/exec"; // ใส่ URL ที่ได้จากตอน Deploy Web App

    window.onload = loadUsers;

    async function loadUsers() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-slate-400">กำลังโหลด...</td></tr>';

        try {
            const response = await fetch(GasUrl, {
                method: 'POST',
                body: JSON.stringify({ action: 'getAllUsers' })
            });
            const result = await response.json();
            renderTable(result.data);
        } catch (err) {
            alert("โหลดข้อมูลไม่สำเร็จ: " + err);
        }
    }

    function renderTable(users) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = users.map(user => `
            <tr class="hover:bg-slate-50 border-b">
                <td class="p-4 font-semibold">${user[1]}</td>
                <td class="p-4">${user[2]}</td>
                <td class="p-4 text-center">
                    <span class="px-3 py-1 rounded-full text-xs ${user[3] === 'Approved' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">
                        ${user[3]}
                    </span>
                </td>
                <td class="p-4 flex justify-center gap-2">
                    <button onclick="updateStatus('${user[0]}', 'Approved')" class="bg-green-500 text-white px-3 py-1 rounded-lg text-sm">อนุมัติ</button>
                    <button onclick="updateStatus('${user[0]}', 'Rejected')" class="bg-red-400 text-white px-3 py-1 rounded-lg text-sm">ปฏิเสธ</button>
                </td>
            </tr>
        `).join('');
    }

    async function updateStatus(uid, status) {
        if (!confirm(`ยืนยันการเปลี่ยนสถานะเป็น ${status}?`)) return;

        try {
            const response = await fetch(GasUrl, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: 'updateStatus', 
                    userId: uid, 
                    status: status 
                })
            });
            const result = await response.json();
            alert(result.message);
            loadUsers(); // โหลดตารางใหม่
        } catch (err) {
            alert("เกิดข้อผิดพลาดในการอัปเดต");
        }
    }
</script>
