<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Chakra Petch', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
    }
    .input-field {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #334155;
      color: #38bdf8;
      transition: all 0.3s;
    }
    .input-field:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      outline: none;
    }
    .result-box { background: rgba(56, 189, 248, 0.1); border: 1px dashed #38bdf8; }
    .tab-btn { transition: all 0.3s; border-bottom: 3px solid transparent; text-transform: uppercase;}
    .tab-btn.active { border-bottom-color: #38bdf8; color: #38bdf8; }
    .hidden { display: none; }
    
    /* สไตล์พิเศษสำหรับชื่อผู้พัฒนา */
    .developer-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 1.5rem;
      padding-top: 1rem;
      text-align: center;
    }
    .dev-text {
      font-size: 0.75rem;
      color: #94a3b8; /* slate-400 */
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .dev-team {
      font-weight: 700;
      color: #38bdf8; /* sky-400 */
      font-size: 1rem;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 0.1em;
      margin-left: 0.25rem;
    }
    /* อักษรพิเศษตกแต่งหน้าหลัง */
    .dev-team::before { content: "› "; color: #f59e0b; /* amber-500 */ }
    .dev-team::after { content: " ‹"; color: #f59e0b; /* amber-500 */ }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full glass-card shadow-2xl p-6 space-y-6">
    
    <div class="flex border-b border-slate-700">
      <button onclick="switchTab('tab1')" id="btn-tab1" class="tab-btn active flex-1 py-2 text-sm font-bold">LAC + CI</button>
      <button onclick="switchTab('tab2')" id="btn-tab2" class="tab-btn flex-1 py-2 text-sm font-bold">Hex to ECI</button>
    </div>

    <div class="text-center">
      <h1 class="text-2xl font-bold text-sky-400 tracking-tight">DTAC 4G CONVERTER</h1>
      <p id="sub-title" class="text-slate-400 text-sm">แปลงค่าจาก CDR ไปเดินเบส</p>
    </div>

    <div id="section-tab1" class="space-y-6">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">กรอก LAC</label>
          <input type="number" id="lacInput" placeholder="เช่น 1174" class="input-field w-full py-3 px-4 rounded-xl text-center text-xl font-bold" oninput="calculateLAC()">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">กรอก CI</label>
          <input type="number" id="ciInput" placeholder="เช่น 10529" class="input-field w-full py-3 px-4 rounded-xl text-center text-xl font-bold" oninput="calculateLAC()">
        </div>
      </div>
    </div>

    <div id="section-tab2" class="space-y-6 hidden">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase text-center">กรอกชุดเลข Hex (เช่น 059EE13)</label>
        <input type="text" id="hexInput" placeholder="เช่น 059EE13" class="input-field w-full py-4 px-4 rounded-xl text-center text-2xl font-bold uppercase" oninput="calculateHex()">
      </div>
    </div>

    <div class="space-y-2 py-4 border-y border-slate-700">
      <div class="flex justify-between text-xs">
        <span class="text-slate-500">Hex Combined:</span>
        <span id="hexProcess" class="font-mono text-amber-400">-</span>
      </div>
      <div class="flex justify-between text-xs">
        <span class="text-slate-500">Split (Front 5 / End):</span>
        <span id="splitProcess" class="font-mono text-amber-400">-</span>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="result-box rounded-2xl p-3 text-center">
        <p class="text-[10px] text-sky-400 font-bold uppercase">eNB</p>
        <div id="enbRes" class="text-2xl font-bold text-white">-</div>
      </div>
      <div class="result-box rounded-2xl p-3 text-center">
        <p class="text-[10px] text-sky-400 font-bold uppercase">CID</p>
        <div id="cidRes" class="text-2xl font-bold text-white">-</div>
      </div>
    </div>

    <div class="bg-gradient-to-r from-sky-600 to-blue-700 rounded-2xl p-4 shadow-lg">
      <p class="text-center text-sky-100 text-xs font-bold uppercase mb-1">ECI RESULT</p>
      <div id="eciRes" class="text-center text-4xl font-bold text-white tracking-wider">-</div>
    </div>

    <div class="text-[10px] text-slate-500 text-center leading-relaxed">
      Logic: <span id="logicText">DEC2HEX(LAC+CI) → Split 5 → eNB*256+CID</span>
    </div>

    <div class="developer-footer">
      <span class="dev-text">ผู้พัฒนา</span>
      <span class="dev-team">IT Team2 IDP6</span>
    </div>

  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('section-tab1').classList.toggle('hidden', tab !== 'tab1');
      document.getElementById('section-tab2').classList.toggle('hidden', tab !== 'tab2');
      document.getElementById('btn-tab1').classList.toggle('active', tab === 'tab1');
      document.getElementById('btn-tab2').classList.toggle('active', tab === 'tab2');
      
      const subTitle = document.getElementById('sub-title');
      const logicText = document.getElementById('logicText');
      
      if(tab === 'tab1') {
        subTitle.innerText = "แปลงค่าจาก CDR ไปเดินเบส";
        logicText.innerText = "DEC2HEX(LAC+CI) → Split 5 → eNB*256+CID";
        calculateLAC();
      } else {
        subTitle.innerText = "แปลงจากชุดเลข Hex เป็น ECI";
        logicText.innerText = "HEX Input → Split Front 5 → eNB*256+CID";
        calculateHex();
      }
    }

    function updateDisplay(hex, front, back, enb, cid, eci) {
      document.getElementById('hexProcess').innerText = hex || "-";
      document.getElementById('splitProcess').innerText = front ? (front + " | " + back) : "-";
      document.getElementById('enbRes').innerText = enb || "-";
      document.getElementById('cidRes').innerText = cid || "-";
      document.getElementById('eciRes').innerText = eci || "-";
    }

    // หน้าที่ 1: LAC + CI
    function calculateLAC() {
      const lac = document.getElementById('lacInput').value;
      const ci = document.getElementById('ciInput').value;
      
      if (lac && ci) {
        const hexLac = parseInt(lac).toString(16).toUpperCase();
        const hexCi = parseInt(ci).toString(16).toUpperCase();
        const combined = hexLac + hexCi;
        processCore(combined);
      } else {
        updateDisplay();
      }
    }

    // หน้าที่ 2: Hex Input
    function calculateHex() {
      const hexValue = document.getElementById('hexInput').value.trim();
      // ยอมรับค่าที่มีความยาว 6 หลักขึ้นไป (front 5 + back อย่างน้อย 1)
      if (hexValue.length >= 6) {
        processCore(hexValue);
      } else {
        updateDisplay();
      }
    }

    // ฟังก์ชันคำนวณหลัก
    function processCore(hexString) {
      try {
        if (!/^[0-9A-Fa-f]+$/.test(hexString)) { // ตรวจสอบว่าเป็น Hex
             updateDisplay();
             return;
        }
        
        // 1. แยกหน้า 5 ตัว และส่วนที่เหลือ
        const front5 = hexString.substring(0, 5);
        const backRemaining = hexString.substring(5);

        // 2. แปลงฐาน 16 เป็น 10
        const enb = parseInt(front5, 16);
        const cid = parseInt(backRemaining, 16);

        // 3. สูตร ECI = (eNB * 256) + CID
        const eci = (enb * 256) + cid;

        if (!isNaN(eci)) {
          updateDisplay(hexString.toUpperCase(), front5.toUpperCase(), backRemaining.toUpperCase(), enb, cid, eci);
        }
      } catch (e) {
        updateDisplay();
      }
    }
    
    // เรียกใช้ calculateLAC() ครั้งแรกเพื่อล้างหน้าจอ
    calculateLAC();
  </script>
</body>
</html>
