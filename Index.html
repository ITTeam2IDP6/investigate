<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Chakra Petch', sans-serif; 
      background-color: #0f172a; 
      color: #f8fafc; 
      margin: 0;
      padding: 0;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    /* ปรับให้เต็มจอในมือถือ */
    @media (max-width: 640px) {
      .glass-card {
        border-radius: 0; /* เอาขอบมนออกเพื่อให้แนบขอบจอ */
        min-height: 100vh;
        border: none;
      }
      body {
        padding: 0;
      }
    }
    .input-field {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #334155;
      color: #38bdf8;
      transition: all 0.3s;
    }
    .input-field:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      outline: none;
    }
    .result-box { background: rgba(56, 189, 248, 0.1); border: 1px dashed #38bdf8; }
    .tab-btn { transition: all 0.3s; border-bottom: 3px solid transparent; }
    .tab-btn.active { border-bottom-color: #38bdf8; color: #38bdf8; }
    .hidden { display: none; }
    
    .developer-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 2rem;
      padding-top: 1.5rem;
      text-align: center;
    }
    .dev-team {
      font-weight: 700;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
      letter-spacing: 0.1em;
    }
    .dev-team::before { content: "› "; color: #f59e0b; }
    .dev-team::after { content: " ‹"; color: #f59e0b; }
  </style>
</head>
<body class="sm:flex sm:items-center sm:justify-center sm:min-h-screen sm:p-4">

  <!-- Container: เต็มหน้าจอในมือถือ, กว้าง 450px ใน Desktop -->
  <div class="w-full sm:max-w-md glass-card shadow-2xl p-6 space-y-6 flex flex-col min-h-screen sm:min-h-fit sm:rounded-[2rem]">
    
    <!-- Tab Navigation -->
    <div class="flex border-b border-slate-700">
      <button onclick="switchTab('tab1')" id="btn-tab1" class="tab-btn active flex-1 py-3 text-sm font-bold uppercase">LAC + CI</button>
      <button onclick="switchTab('tab2')" id="btn-tab2" class="tab-btn flex-1 py-3 text-sm font-bold uppercase">Hex to ECI</button>
    </div>

    <!-- Header -->
    <div class="text-center pt-2">
      <h1 class="text-3xl font-bold text-sky-400 tracking-tight">DTAC 4G CONVERTER</h1>
      <p id="sub-title" class="text-slate-400 text-sm mt-1">แปลงค่าจาก CDR ไปเดินเบส</p>
    </div>

    <!-- Content Sections -->
    <div class="flex-grow space-y-6">
      <!-- Section 1: LAC + CI -->
      <div id="section-tab1" class="space-y-6">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase">กรอก LAC</label>
            <input type="number" id="lacInput" placeholder="1174" class="input-field w-full py-4 px-4 rounded-2xl text-center text-2xl font-bold" oninput="calculateLAC()">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase">กรอก CI</label>
            <input type="number" id="ciInput" placeholder="10529" class="input-field w-full py-4 px-4 rounded-2xl text-center text-2xl font-bold" oninput="calculateLAC()">
          </div>
        </div>
      </div>

      <!-- Section 2: Hex Direct -->
      <div id="section-tab2" class="space-y-6 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase text-center">กรอกชุดเลข Hex (เช่น 059EE13)</label>
          <input type="text" id="hexInput" placeholder="059EE13" class="input-field w-full py-4 px-4 rounded-2xl text-center text-3xl font-bold uppercase" oninput="calculateHex()">
        </div>
      </div>

      <!-- Process Display -->
      <div class="space-y-3 py-4 border-y border-slate-800">
        <div class="flex justify-between items-center text-xs">
          <span class="text-slate-500 font-semibold">Hex Combined:</span>
          <span id="hexProcess" class="font-mono text-amber-400 text-sm">-</span>
        </div>
        <div class="flex justify-between items-center text-xs">
          <span class="text-slate-500 font-semibold">Split (Front 5 / End):</span>
          <span id="splitProcess" class="font-mono text-amber-400 text-sm">-</span>
        </div>
      </div>

      <!-- eNB & CID Result -->
      <div class="grid grid-cols-2 gap-4">
        <div class="result-box rounded-2xl p-4 text-center">
          <p class="text-[10px] text-sky-400 font-bold uppercase mb-1">eNB</p>
          <div id="enbRes" class="text-3xl font-bold text-white">-</div>
        </div>
        <div class="result-box rounded-2xl p-4 text-center">
          <p class="text-[10px] text-sky-400 font-bold uppercase mb-1">CID</p>
          <div id="cidRes" class="text-3xl font-bold text-white">-</div>
        </div>
      </div>

      <!-- ECI Main Result -->
      <div class="bg-gradient-to-br from-sky-500 to-blue-700 rounded-2xl p-6 shadow-lg border border-sky-400/20">
        <p class="text-center text-sky-100 text-[10px] font-bold uppercase mb-2">ECI RESULT</p>
        <div id="eciRes" class="text-center text-5xl font-bold text-white tracking-widest">-</div>
      </div>
    </div>

    <!-- Footer -->
    <div>
      <div class="text-[10px] text-slate-500 text-center leading-relaxed italic">
        Logic: <span id="logicText">DEC2HEX(LAC+CI) → Split 5 → eNB*256+CID</span>
      </div>

      <div class="developer-footer">
        <p class="text-[10px] text-slate-400 uppercase mb-1">Developer</p>
        <span class="dev-team text-lg">IT Team2 IDP6</span>
      </div>
    </div>

  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('section-tab1').classList.toggle('hidden', tab !== 'tab1');
      document.getElementById('section-tab2').classList.toggle('hidden', tab !== 'tab2');
      document.getElementById('btn-tab1').classList.toggle('active', tab === 'tab1');
      document.getElementById('btn-tab2').classList.toggle('active', tab === 'tab2');
      
      const subTitle = document.getElementById('sub-title');
      const logicText = document.getElementById('logicText');
      
      if(tab === 'tab1') {
        subTitle.innerText = "แปลงค่าจาก CDR ไปเดินเบส";
        logicText.innerText = "DEC2HEX(LAC+CI) → Split 5 → eNB*256+CID";
        calculateLAC();
      } else {
        subTitle.innerText = "แปลงจากชุดเลข Hex เป็น ECI";
        logicText.innerText = "HEX Input → Split Front 5 → eNB*256+CID";
        calculateHex();
      }
    }

    function updateDisplay(hex, front, back, enb, cid, eci) {
      document.getElementById('hexProcess').innerText = hex || "-";
      document.getElementById('splitProcess').innerText = front ? (front + " | " + back) : "-";
      document.getElementById('enbRes').innerText = enb || "-";
      document.getElementById('cidRes').innerText = cid || "-";
      document.getElementById('eciRes').innerText = eci || "-";
    }

    function calculateLAC() {
      const lac = document.getElementById('lacInput').value;
      const ci = document.getElementById('ciInput').value;
      if (lac && ci) {
        const hexLac = parseInt(lac).toString(16).toUpperCase();
        const hexCi = parseInt(ci).toString(16).toUpperCase();
        processCore(hexLac + hexCi);
      } else { updateDisplay(); }
    }

    function calculateHex() {
      const hexValue = document.getElementById('hexInput').value.trim();
      if (hexValue.length >= 6) { processCore(hexValue); } 
      else { updateDisplay(); }
    }

    function processCore(hexString) {
      try {
        if (!/^[0-9A-Fa-f]+$/.test(hexString)) { updateDisplay(); return; }
        const front5 = hexString.substring(0, 5);
        const backRemaining = hexString.substring(5);
        const enb = parseInt(front5, 16);
        const cid = parseInt(backRemaining, 16);
        const eci = (enb * 256) + cid;
        if (!isNaN(eci)) {
          updateDisplay(hexString.toUpperCase(), front5.toUpperCase(), backRemaining.toUpperCase(), enb, cid, eci);
        }
      } catch (e) { updateDisplay(); }
    }
    
    calculateLAC();
  </script>
</body>
</html>
