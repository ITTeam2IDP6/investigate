<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์ของฉัน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: #fcfcfd; 
        }
        /* พื้นหลังส่วนหัว น้ำเงินไล่เฉดพร้อมประกายทองอ่อนๆ */
        .header-bg { 
            background: radial-gradient(circle at top right, #fde04720 0%, transparent 40%),
                        linear-gradient(180deg, #3730a3 0%, #4338ca 100%);
        }
        .profile-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        /* ตกแต่ง Input ให้ดูพรีเมียม */
        .form-input {
            transition: all 0.2s ease-in-out;
            border: 1px solid #f1f5f9;
            background-color: #f8fafc;
        }
        .form-input:focus {
            background-color: #fff;
            border-color: #fbbf24;
            box-shadow: 0 0 0 4px #fbbf2415;
            outline: none;
        }
        /* ปุ่มน้ำเงินทางการ */
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-primary:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div class="max-w-md mx-auto min-h-screen flex flex-col relative">
        
        <!-- Header Section -->
        <div class="header-bg pt-12 pb-24 px-6 text-center text-white rounded-b-[3.5rem] shadow-2xl relative overflow-hidden">
            <!-- ตกแต่งแสงสีทองฟุ้งๆ -->
            <div class="absolute top-[-10%] right-[-10%] w-40 h-40 bg-yellow-300 blur-[80px] opacity-20"></div>
            
            <div class="relative inline-block mt-4">
                <div class="w-32 h-32 rounded-full border-[3px] border-white/30 p-1 shadow-2xl mx-auto overflow-hidden bg-white/10 backdrop-blur-sm">
                    <img id="displayImg" src="https://via.placeholder.com/150" class="w-full h-full rounded-full object-cover shadow-inner">
                </div>
                <!-- Status Badge ทับบนรูป -->
                <div id="statusBadge" class="absolute bottom-1 right-1 px-3 py-1 rounded-full text-[10px] font-bold shadow-lg border border-white/20">
                    ...
                </div>
            </div>
            
            <h1 id="displayName" class="text-2xl font-semibold mt-5 tracking-wide">-</h1>
            <p id="displayUid" class="text-indigo-200 text-[10px] font-light mt-1 opacity-60 tracking-tighter uppercase">-</p>
        </div>

        <!-- Form Section -->
        <div class="px-5 -mt-14 mb-10 relative z-10">
            <div class="bg-white rounded-[2.5rem] profile-card p-8 space-y-6 border border-slate-100">
                
                <div class="space-y-1">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">ชื่อ-นามสกุล</label>
                    <input type="text" id="name" placeholder="ระบุชื่อของคุณ" 
                           class="w-full form-input rounded-2xl px-5 py-4 text-slate-700 font-medium">
                </div>

                <div class="space-y-1">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">เบอร์โทรศัพท์</label>
                    <input type="tel" id="phone" placeholder="0XXXXXXXXX" 
                           class="w-full form-input rounded-2xl px-5 py-4 text-slate-700 font-medium">
                </div>

                <div class="space-y-1">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">GMAIL</label>
                    <input type="email" id="email" placeholder="example@gmail.com" 
                           class="w-full form-input rounded-2xl px-5 py-4 text-slate-700 font-medium">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">สภ.</label>
                        <input type="text" id="station" placeholder="สังกัด" 
                               class="w-full form-input rounded-2xl px-5 py-4 text-slate-700 font-medium">
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">ภาค</label>
                        <select id="region" class="w-full form-input rounded-2xl px-5 py-4 text-slate-700 font-medium appearance-none">
                            <option value="1">ภาค 1</option><option value="2">ภาค 2</option><option value="3">ภาค 3</option>
                            <option value="4">ภาค 4</option><option value="5">ภาค 5</option><option value="6">ภาค 6</option>
                            <option value="7">ภาค 7</option><option value="8">ภาค 8</option><option value="9">ภาค 9</option>
                        </select>
                    </div>
                </div>

                <button onclick="updateProfile()" id="btnUpdate" 
                        class="w-full btn-primary text-white font-semibold py-4 rounded-2xl shadow-xl shadow-indigo-200 text-lg mt-4">
                    อัปเดตข้อมูลโปรไฟล์
                </button>
            </div>
            
            <p class="text-center text-slate-300 text-[10px] mt-6 tracking-widest uppercase">Member Profile Management System</p>
        </div>
    </div>

    <script>
        // เปลี่ยน URL เป็นของท่าน
        const LiffId = "2009632664-1LuqGmDX"; 
        const GasUrl = "https://script.google.com/macros/s/AKfycbwuQGtRMZG1LhpuM4jBKHdjDwzlENSKmqrAyWAtGKPOBrPfXeKX_AS5KIGBXgg_m3xunw/exec";

        async function main() {
            await liff.init({ liffId: LiffId });
            if (!liff.isLoggedIn()) { liff.login(); }
            else { getUserData(); }
        }

        async function getUserData() {
            const profile = await liff.getProfile();
            document.getElementById('displayUid').innerText = profile.userId;
            document.getElementById('displayImg').src = profile.pictureUrl;

            const response = await fetch(GasUrl, {
                method: 'POST',
                body: JSON.stringify({ action: 'getUser', userId: profile.userId })
            });
            const result = await response.json();

            if (result.status === 'success') {
                const user = result.data;
                document.getElementById('displayName').innerText = user.name;
                document.getElementById('name').value = user.name;
                document.getElementById('phone').value = user.phone;
                document.getElementById('email').value = user.email || '';
                document.getElementById('station').value = user.station;
                document.getElementById('region').value = user.region;

                const badge = document.getElementById('statusBadge');
                badge.innerText = user.status === 'Approved' ? '✓ Approved' : '⟳ Pending';
                badge.className = user.status === 'Approved' 
                    ? 'absolute bottom-1 right-1 px-3 py-1 rounded-full text-[10px] font-bold shadow-md bg-green-500 text-white border border-green-400' 
                    : 'absolute bottom-1 right-1 px-3 py-1 rounded-full text-[10px] font-bold shadow-md bg-amber-500 text-white border border-amber-400';
            }
        }

        async function updateProfile() {
            const btn = document.getElementById('btnUpdate');
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-pulse">กำลังบันทึกข้อมูล...</span>';

            const payload = {
                action: 'editUser',
                userId: document.getElementById('displayUid').innerText,
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                station: document.getElementById('station').value,
                region: document.getElementById('region').value
            };

            try {
                const response = await fetch(GasUrl, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.json();
                alert("สำเร็จ: " + result.message);
                location.reload();
            } catch (err) {
                alert("เกิดข้อผิดพลาด กรุณาลองใหม่");
                btn.disabled = false;
                btn.innerText = "อัปเดตข้อมูลโปรไฟล์";
            }
        }
        main();
    </script>
</body>
</html>
