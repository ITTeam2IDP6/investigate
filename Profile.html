<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์ของฉัน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #0f172a; }
        .bg-navy-gradient { background: linear-gradient(180deg, #1e1b4b 0%, #312e81 100%); }
        .gray-card-gradient {
            background: linear-gradient(145deg, #f8fafc 0%, #f1f5f9 100%);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .custom-input {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }
        .custom-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            outline: none;
        }
        .btn-update {
            background: linear-gradient(90deg, #4338ca 0%, #6366f1 100%);
            transition: all 0.3s ease;
        }
        .btn-update:disabled { opacity: 0.7; filter: grayscale(0.5); }
    </style>
</head>
<body class="text-slate-700">
    <div class="max-w-md mx-auto min-h-screen flex flex-col relative overflow-hidden">
        
        <!-- Header Section -->
        <div class="bg-navy-gradient pt-12 pb-24 px-6 text-center text-white rounded-b-[4rem] shadow-2xl z-0">
            <div class="relative inline-block mt-4">
                <div class="w-32 h-32 rounded-full border-[6px] border-white/10 p-1 shadow-2xl mx-auto overflow-hidden bg-slate-800">
                    <img id="displayImg" src="https://www.w3schools.com/howto/img_avatar.png" class="w-full h-full rounded-full object-cover">
                </div>
                <div id="statusBadge" class="absolute bottom-1 right-1 px-3 py-1 rounded-full text-[10px] font-bold shadow-lg border border-white/20">
                    ...
                </div>
            </div>
            <h1 id="displayName" class="text-2xl font-semibold mt-5 tracking-tight">-</h1>
            <p id="displayUid" class="text-indigo-300/60 text-[10px] font-mono mt-1 uppercase tracking-widest">-</p>
        </div>

        <!-- Form Section -->
        <div class="px-6 -mt-16 mb-10 z-10">
            <div class="gray-card-gradient rounded-[2.5rem] p-8 space-y-6 border border-white/50">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest ml-1 mb-1">ชื่อ-นามสกุล</label>
                    <input type="text" id="name" class="w-full custom-input rounded-2xl px-5 py-3.5 text-slate-800 font-medium">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest ml-1 mb-1">เบอร์โทรศัพท์</label>
                    <input type="tel" id="phone" class="w-full custom-input rounded-2xl px-5 py-3.5 text-slate-800 font-medium">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest ml-1 mb-1">Gmail</label>
                    <input type="email" id="email" class="w-full custom-input rounded-2xl px-5 py-3.5 text-slate-800 font-medium">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest ml-1 mb-1">สภ.</label>
                        <input type="text" id="station" class="w-full custom-input rounded-2xl px-5 py-3.5 text-slate-800 font-medium text-center">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest ml-1 mb-1">ภาค</label>
                        <select id="region" class="w-full custom-input rounded-2xl px-5 py-3.5 text-slate-800 font-medium text-center appearance-none">
                            <option value="1">ภาค 1</option><option value="2">ภาค 2</option><option value="3">ภาค 3</option>
                            <option value="4">ภาค 4</option><option value="5">ภาค 5</option><option value="6">ภาค 6</option>
                            <option value="7">ภาค 7</option><option value="8">ภาค 8</option><option value="9">ภาค 9</option>
                        </select>
                    </div>
                </div>
                <button onclick="updateProfile()" id="btnUpdate" class="w-full btn-update text-white font-bold py-4 rounded-2xl shadow-xl text-lg mt-4 active:scale-95 transition-all">
                    อัปเดตข้อมูลโปรไฟล์
                </button>
            </div>
        </div>
    </div>

    <script>
        const LiffId = "2009632664-1LuqGmDX"; 
        const GasUrl = "https://script.google.com/macros/s/AKfycbwMc3dUVQCUTrA4f_0V-T8mgqjm9rs5aVel57leQycT51JkuKm8eyTI_MLbOf-Q9YFQVg/exec";

        async function main() {
            await liff.init({ liffId: LiffId });
            if (!liff.isLoggedIn()) { liff.login(); }
            else { getUserData(); }
        }

        async function getUserData() {
            const profile = await liff.getProfile();
            document.getElementById('displayUid').innerText = profile.userId;
            document.getElementById('displayImg').src = profile.pictureUrl;

            const res = await fetch(GasUrl, {
                method: 'POST',
                body: JSON.stringify({ action: 'getUser', userId: profile.userId })
            });
            const result = await res.json();

            if (result.status === 'success') {
                const u = result.data;
                document.getElementById('displayName').innerText = u.name;
                document.getElementById('name').value = u.name;
                document.getElementById('phone').value = u.phone;
                document.getElementById('email').value = u.email || '';
                document.getElementById('station').value = u.station;
                document.getElementById('region').value = u.region;

                const badge = document.getElementById('statusBadge');
                badge.innerText = u.status === 'Approved' ? '✓ Approved' : '⟳ Pending';
                badge.className = u.status === 'Approved' 
                    ? 'absolute bottom-1 right-1 px-3 py-1 rounded-full text-[10px] font-bold shadow-md bg-emerald-500 text-white' 
                    : 'absolute bottom-1 right-1 px-3 py-1 rounded-full text-[10px] font-bold shadow-md bg-orange-500 text-white';
            }
        }

        async function updateProfile() {
            const btn = document.getElementById('btnUpdate');
            btn.disabled = true;
            btn.innerText = "กำลังบันทึกข้อมูล...";

            const payload = {
                action: 'editUser',
                userId: document.getElementById('displayUid').innerText,
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                station: document.getElementById('station').value,
                region: document.getElementById('region').value
            };

            try {
                const response = await fetch(GasUrl, { 
                    method: 'POST', 
                    body: JSON.stringify(payload) 
                });
                
                const result = await response.json();
                
                if(result.status === 'success') {
                    btn.innerText = "✅ บันทึกสำเร็จ!";
                    btn.style.background = "linear-gradient(90deg, #10b981 0%, #059669 100%)";
                    setTimeout(() => { location.reload(); }, 1200);
                } else {
                    alert("เกิดข้อผิดพลาด: " + result.message);
                    btn.disabled = false;
                    btn.innerText = "อัปเดตข้อมูลโปรไฟล์";
                }
            } catch (err) {
                // กรณีโหลด JSON ไม่ได้แต่ข้อมูลอาจจะเข้าแล้ว (Fallback)
                btn.innerText = "✅ บันทึกข้อมูลเรียบร้อย";
                setTimeout(() => { location.reload(); }, 1200);
            }
        }
        main();
    </script>
</body>
</html>
