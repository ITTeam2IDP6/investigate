<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์ของฉัน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
        
        /* สีน้ำเงินเข้มหรูหรา */
        .bg-deep-navy { background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); }
        
        /* สีทอง Luxury */
        .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%); }
        .text-gold { color: #b8860b; }
        .border-gold { border-color: #d4af37; }
        
        .input-gold-focus:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }
    </style>
</head>
<body class="text-slate-700">
    <div class="max-w-md mx-auto min-h-screen flex flex-col">
        <!-- Header Section: Deep Navy -->
        <div class="bg-deep-navy pt-12 pb-24 px-6 text-center text-white rounded-b-[3.5rem] shadow-2xl relative">
            <div class="relative inline-block mt-4">
                <div class="w-32 h-32 rounded-full border-4 border-gold shadow-2xl mx-auto overflow-hidden">
                    <img id="displayImg" src="https://www.w3schools.com/howto/img_avatar.png" class="w-full h-full object-cover">
                </div>
                <div id="statusBadge" class="absolute bottom-1 right-1 px-3 py-1 rounded-full text-[10px] font-bold shadow-lg border border-white/20">
                    ...
                </div>
            </div>
            <h1 id="displayName" class="text-2xl font-bold mt-5 tracking-tight text-slate-100">-</h1>
            <p id="displayUid" class="text-slate-400 text-[10px] font-mono mt-1 opacity-60 tracking-widest uppercase">-</p>
        </div>

        <!-- Content Section -->
        <div class="px-6 -mt-16 mb-10 z-10">
            <div class="bg-white rounded-[2.5rem] shadow-2xl border border-gold/10 p-8 space-y-6">
                
                <div class="space-y-1">
                    <label class="block text-[11px] font-bold text-gold uppercase tracking-widest ml-1">ชื่อ-นามสกุล</label>
                    <input type="text" id="name" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-3.5 text-slate-800 font-medium input-gold-focus transition-all">
                </div>

                <div class="space-y-1">
                    <label class="block text-[11px] font-bold text-gold uppercase tracking-widest ml-1">เบอร์โทรศัพท์</label>
                    <input type="tel" id="phone" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-3.5 text-slate-800 font-medium input-gold-focus transition-all">
                </div>

                <div class="space-y-1">
                    <label class="block text-[11px] font-bold text-gold uppercase tracking-widest ml-1">Gmail</label>
                    <input type="email" id="email" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-3.5 text-slate-800 font-medium input-gold-focus transition-all">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="block text-[11px] font-bold text-gold uppercase tracking-widest ml-1 text-center">สภ.</label>
                        <input type="text" id="station" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-slate-800 font-medium text-center input-gold-focus transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="block text-[11px] font-bold text-gold uppercase tracking-widest ml-1 text-center">ภาค</label>
                        <select id="region" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-slate-800 font-medium text-center input-gold-focus transition-all appearance-none">
                            <option value="1">ภาค 1</option><option value="2">ภาค 2</option><option value="3">ภาค 3</option>
                            <option value="4">ภาค 4</option><option value="5">ภาค 5</option><option value="6">ภาค 6</option>
                            <option value="7">ภาค 7</option><option value="8">ภาค 8</option><option value="9">ภาค 9</option>
                        </select>
                    </div>
                </div>

                <!-- ปุ่มอัปเดตสีทอง ตัวหนังสือขาว -->
                <button onclick="updateProfile()" id="btnUpdate" class="w-full gold-gradient text-white font-bold py-4 rounded-2xl shadow-xl shadow-gold/20 text-lg mt-4 active:scale-95 transition-all">
                    อัปเดตข้อมูลโปรไฟล์
                </button>
            </div>
            
            <p class="text-center text-slate-400 text-[10px] mt-8 tracking-widest uppercase opacity-50">Profile Management System</p>
        </div>
    </div>

    <script>
        const LiffId = "2009632664-1LuqGmDX"; 
        const GasUrl = "https://script.google.com/macros/s/AKfycbwMc3dUVQCUTrA4f_0V-T8mgqjm9rs5aVel57leQycT51JkuKm8eyTI_MLbOf-Q9YFQVg/exec";

        async function main() {
            await liff.init({ liffId: LiffId });
            if (!liff.isLoggedIn()) { liff.login(); }
            else { getUserData(); }
        }

        async function getUserData() {
            const profile = await liff.getProfile();
            document.getElementById('displayUid').innerText = profile.userId;
            document.getElementById('displayImg').src = profile.pictureUrl;

            const res = await fetch(GasUrl, {
                method: 'POST',
                body: JSON.stringify({ action: 'getUser', userId: profile.userId })
            });
            const result = await res.json();

            if (result.status === 'success') {
                const u = result.data;
                document.getElementById('displayName').innerText = u.name;
                document.getElementById('name').value = u.name;
                document.getElementById('phone').value = u.phone;
                document.getElementById('email').value = u.email || '';
                document.getElementById('station').value = u.station;
                document.getElementById('region').value = u.region;

                const badge = document.getElementById('statusBadge');
                badge.innerText = u.status === 'Approved' ? '✓ Approved' : '⟳ Pending';
                badge.className = u.status === 'Approved' 
                    ? 'absolute bottom-1 right-1 px-3 py-1 rounded-full text-[10px] font-bold shadow-md bg-emerald-500 text-white' 
                    : 'absolute bottom-1 right-1 px-3 py-1 rounded-full text-[10px] font-bold shadow-md bg-orange-500 text-white';
            }
        }

        async function updateProfile() {
            const btn = document.getElementById('btnUpdate');
            btn.disabled = true;
            btn.innerText = "กำลังบันทึกข้อมูล...";

            const payload = {
                action: 'editUser',
                userId: document.getElementById('displayUid').innerText,
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                station: document.getElementById('station').value,
                region: document.getElementById('region').value
            };

            try {
                const response = await fetch(GasUrl, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.json();
                if(result.status === 'success') {
                    btn.innerText = "✅ บันทึกสำเร็จ!";
                    btn.style.background = "#10b981";
                    setTimeout(() => { location.reload(); }, 1200);
                } else {
                    alert(result.message);
                    btn.disabled = false;
                    btn.innerText = "อัปเดตข้อมูลโปรไฟล์";
                }
            } catch (err) {
                btn.innerText = "✅ บันทึกข้อมูลเรียบร้อย";
                setTimeout(() => { location.reload(); }, 1200);
            }
        }
        main();
    </script>
</body>
</html>
