<!-- คัดลอกส่วนนี้ไปทับไฟล์เดิมได้เลย -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนเข้าใช้งานระบบ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-md rounded-3xl shadow-2xl overflow-hidden my-8">
        <!-- Header -->
        <div class="bg-indigo-600 p-8 text-center text-white">
            <div class="inline-flex p-3 bg-white/20 rounded-full mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </div>
            <h1 class="text-2xl font-semibold">ลงทะเบียนสมาชิก</h1>
            <p class="text-indigo-100 text-sm mt-1">กรุณากรอกข้อมูลเพื่อขออนุมัติเข้าใช้งาน</p>
        </div>

        <!-- Form -->
        <div class="p-8 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล</label>
                <input type="text" id="name" placeholder="ระบุชื่อจริงของคุณ" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทรศัพท์</label>
                <input type="tel" id="phone" placeholder="08x-xxxxxxx" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email (Gmail)</label>
                <input type="email" id="email" placeholder="example@gmail.com" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none transition">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">สายงาน</label>
                    <input type="text" id="jobLine" placeholder="เช่น ปราบปราม" class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">สภ.</label>
                    <input type="text" id="station" placeholder="ชื่อสถานี" class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ภาค</label>
                <input type="text" id="region" placeholder="เช่น ภาค 1" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none transition">
            </div>

            <button onclick="submitData()" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 px-6 rounded-xl shadow-lg transition transform active:scale-95 flex justify-center items-center">
                <span>ส่งข้อมูลลงทะเบียน</span>
            </button>
            <p class="text-center text-xs text-gray-400">ข้อมูลของคุณจะได้รับการตรวจสอบจากเจ้าหน้าที่</p>
        </div>
    </div>

    <script>
        const LiffId = "2009632664-3vVVvlJR"; 
        const GasUrl = "https://script.google.com/macros/s/AKfycbwuQGtRMZG1LhpuM4jBKHdjDwzlENSKmqrAyWAtGKPOBrPfXeKX_AS5KIGBXgg_m3xunw/exec"; 

        async function main() {
            try {
                await liff.init({ liffId: LiffId });
                if (!liff.isLoggedIn()) { liff.login(); }
            } catch (err) { console.error("LIFF Init Error", err); }
        }
        main();

        async function submitData() {
            const inputs = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                jobLine: document.getElementById('jobLine').value,
                station: document.getElementById('station').value,
                region: document.getElementById('region').value
            };
            const btn = document.getElementById('btnSubmit');

            if (Object.values(inputs).some(val => !val)) {
                alert("กรุณากรอกข้อมูลให้ครบทุกช่องครับ");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white mr-2" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังบันทึก...`;

            try {
                const profile = await liff.getProfile();
                const payload = {
                    userId: profile.userId,
                    pictureUrl: profile.pictureUrl || "",
                    ...inputs
                };

                const response = await fetch(GasUrl, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.status === 'success') {
                    alert("ลงทะเบียนเรียบร้อย! กรุณารอเจ้าหน้าที่ตรวจสอบ");
                    liff.closeWindow();
                } else { throw new Error(); }
            } catch (err) {
                alert("เกิดข้อผิดพลาด ลองใหม่อีกครั้ง");
                btn.disabled = false;
                btn.innerHTML = "ส่งข้อมูลลงทะเบียน";
            }
        }
    </script>
</body>
</html>
