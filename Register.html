<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนเข้าใช้งานระบบ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-md rounded-3xl shadow-2xl overflow-hidden">
        
        <div class="bg-indigo-600 p-8 text-center text-white">
            <div class="inline-flex p-3 bg-white/20 rounded-full mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </div>
            <h1 class="text-2xl font-semibold">ลงทะเบียนสมาชิก</h1>
            <p class="text-indigo-100 text-sm mt-1">กรุณากรอกข้อมูลเพื่อขออนุมัติเข้าใช้งาน</p>
        </div>

        <div class="p-8 space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล</label>
                <input type="text" id="name" placeholder="ระบุชื่อจริงของคุณ" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทรศัพท์</label>
                <input type="tel" id="phone" placeholder="08x-xxxxxxx" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition">
            </div>

            <button onclick="submitData()" id="btnSubmit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl shadow-lg shadow-indigo-200 transition transform active:scale-95 flex justify-center items-center">
                <span>ส่งข้อมูลลงทะเบียน</span>
            </button>
            
            <p class="text-center text-xs text-gray-400">ระบบจะส่งข้อมูลไปยังเจ้าหน้าที่เพื่อพิจารณาอนุมัติ</p>
        </div>
    </div>

    <script>
        // --- ค่าคอนฟิก (ดึงมาจากโค้ดเดิมของคุณ) ---
        const LiffId = "2009632664-3vVVvlJR"; 
        const GasUrl = "https://script.google.com/macros/s/AKfycbwuQGtRMZG1LhpuM4jBKHdjDwzlENSKmqrAyWAtGKPOBrPfXeKX_AS5KIGBXgg_m3xunw/exec"; 

        // ฟังก์ชันเริ่มทำงานเมื่อโหลดหน้าเว็บ
        async function main() {
            try {
                await liff.init({ liffId: LiffId });
                if (!liff.isLoggedIn()) {
                    liff.login(); // ถ้ายังไม่ Login ให้พาไป Login ของ LINE
                }
            } catch (err) {
                console.error("LIFF Init Error", err);
                // alert("เกิดข้อผิดพลาดในการเชื่อมต่อ LINE");
            }
        }
        main(); // สั่งให้ทำงานทันที

     const profile = await liff.getProfile();
const data = {
    userId: profile.userId,
    name: document.getElementById('name').value,
    phone: document.getElementById('phone').value,
    pictureUrl: profile.pictureUrl // เพิ่มบรรทัดนี้เพื่อส่งรูปภาพ
};

    if (!name || !phone) {
        alert("กรุณากรอกข้อมูลให้ครบถ้วนครับ");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = "กำลังบันทึกข้อมูล...";

    try {
        // ดึง Profile รวมถึงรูปภาพ
        const profile = await liff.getProfile();
        
        const payload = {
            userId: profile.userId,
            name: name,
            phone: phone,
            pictureUrl: profile.pictureUrl // เพิ่มการส่งรูปภาพ
        };

        const response = await fetch(GasUrl, {
            method: "POST",
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
            alert("บันทึกข้อมูลเรียบร้อยแล้ว! ตรวจสอบรายละเอียดในช่องแชทนะครับ");
            liff.closeWindow();
        }
    } catch (err) {
        console.error(err);
        alert("เกิดข้อผิดพลาด");
        btn.disabled = false;
        btn.innerHTML = "ส่งข้อมูลลงทะเบียน";
    }
}
            // --- ส่วนที่เพิ่มใหม่: แสดงสถานะกำลังโหลด ---
            btn.disabled = true; // ห้ามกดซ้ำ
            btn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                กำลังบันทึกข้อมูล...`;
            btn.classList.replace('bg-indigo-600', 'bg-gray-400'); // เปลี่ยนสีปุ่มเป็นสีเทา

            try {
                // ดึง Profile จาก LINE
                const profile = await liff.getProfile();
                
                // เตรียมข้อมูลส่งไปยัง Google Sheets
                const payload = {
                    userId: profile.userId,
                    name: name,
                    phone: phone
                };

                // ส่งข้อมูล (ใช้ fetch แบบ POST)
                const response = await fetch(GasUrl, {
                    method: "POST",
                    body: JSON.stringify(payload) // ส่งเป็น String JSON
                });

                // --- ส่วนที่เพิ่มใหม่: ตรวจสอบการตอบกลับ (สำคัญสำหรับ CORS) ---
                const result = await response.json();

                if (result.status === 'success' || result.result === 'success') {
                    alert("ส่งข้อมูลสำเร็จ! ระบบจะแจ้งผลการอนุมัติผ่าน LINE นะครับ");
                    liff.closeWindow(); // ปิดหน้าต่าง LIFF ทันที
                } else {
                    throw new Error("Server returned error");
                }

            } catch (err) {
                console.error("Submit Error", err);
                alert("เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง หรือติดต่อเจ้าหน้าที่");
                
                // คืนค่าปุ่มกลับมาให้กดใหม่ได้
                btn.disabled = false;
                btn.innerHTML = "ส่งข้อมูลลงทะเบียน";
                btn.classList.replace('bg-gray-400', 'bg-indigo-600');
            }
        }
    </script>
</body>
</html>
